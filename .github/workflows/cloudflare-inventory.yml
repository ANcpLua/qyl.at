name: Cloudflare inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-inventory.yml
      - scripts/cloudflare-inventory.mjs

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Inspect existing Cloudflare resources
        run: node scripts/cloudflare-inventory.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Save resource inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-inventory
          path: evidence/cloudflare-inventory.json
          if-no-files-found: error
