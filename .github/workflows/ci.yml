name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger so the Worker can be redeployed without an empty commit —
  # needed to re-verify after a Cloudflare token is rolled or re-scoped.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # `wrangler dev` -- the Playwright webServer -- exits by itself when its
      # ProxyWorker fails to reach the UserWorker, and it renders that fault as
      # a bare `✘ [ERROR]` with an empty message. The only readable description
      # lives in its debug log, which defaults to a path outside the workspace
      # ($XDG_CONFIG_HOME/.wrangler/logs) and so was thrown away with the
      # runner. Point it inside the workspace so the step below can publish it:
      # a failure has to be diagnosable from the run that produced it, not from
      # a re-run that passes.
      - run: npm test
        env:
          WRANGLER_LOG_PATH: ${{ github.workspace }}/wrangler-logs

      - name: Upload verify evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-evidence
          path: |
            wrangler-logs/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - run: npx wrangler deploy --dry-run

  # Deploy only after verify passes, and only for main. Without this job the
  # live Worker is whatever was last pushed by hand from a laptop, which can
  # silently drift from main.
  deploy:
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-qyl-at
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      # Fail with a readable message rather than a cryptic wrangler auth error.
      # Deliberately a hard failure, not a skip: a silently skipped deploy is
      # the exact drift this job exists to prevent.
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings > Environments > production. Until then qyl.at is deployed only by hand and can drift from main."
            exit 1
          fi

      - run: npm ci
      - run: npm run build:site

      # service.version is stamped with the deployed commit so a vitals
      # regression in the collector can be traced back to a specific deploy.
      - run: npx wrangler deploy --var QYL_SERVICE_VERSION:"${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # A repo variable, not a secret: the account id is an identifier that
          # appears in every dashboard URL, and pinning it stops wrangler from
          # having to infer the account from the token's scope.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
