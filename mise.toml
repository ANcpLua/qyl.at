# The toolchain this repository builds with; `mise install` installs it.
[tools]
"bun" = "1.4.3"
# bun installs and runs the scripts; node runs the astro, wrangler and playwright CLIs,
# the scripts/*.mjs checks and `node --test`, so it must stay inside engines.node.
"node" = "24.21.0"

[tasks.check]
description = "The gate before a push or a deploy; a line per step, full log in artifacts/logs, QYL_VERBOSE=1 prints everything"
quiet = true
run = "scripts/quiet.sh check 'bun install --frozen-lockfile' 'bun run check'"

[tasks.test-gates]
description = "The on-demand Playwright suite (bun run test:gates) after a build; quiet like check"
quiet = true
run = "scripts/quiet.sh test-gates 'bun run build' 'bun run test:gates'"
