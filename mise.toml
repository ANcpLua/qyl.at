# The toolchain this repository builds with; `mise install` installs it.
[tools]
"bun" = "1.4.3"
# bun installs and runs the scripts; node runs the astro, wrangler and playwright CLIs,
# the scripts/*.mjs checks and `node --test`, so it must stay inside engines.node.
"node" = "24.21.0"

[tasks.check]
description = "The gate before a push or a deploy"
run = [
  "bun install --frozen-lockfile",
  "bun run check",
]
