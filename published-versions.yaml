# Published and indexed versions of the qyl-dev repos, read from the registries.
# The registries are the truth; each producer's release.sh runs
# qyl.at/scripts/refresh-published-versions.sh once its release is indexed and verified,
# which rewrites, commits and pushes this file; git log dates each refresh.
repos:
  qyl:
    nuget: {qyl: 13.0.0, qyl.osx-arm64: 13.0.0, qyl.osx-x64: 13.0.0, qyl.linux-arm64: 13.0.0, qyl.linux-x64: 13.0.0, qyl.win-x64: 13.0.0, qyl.win-arm64: 13.0.0, Qyl.Api.Sdk: 13.0.0}
    latest: 13.0.0
    deploys: https://api.qyl.at (qyl-collector, Railway) on push to main; serving contract revision sha256:41d5630fd3633e2a
  qyl-api-schema:
    nuget: {Qyl.Api.Contracts: 12.1.2}
    npm: {"@ancplua/qyl-api-schema": 12.1.2}
    latest: 12.1.2
    contract_revision_served: sha256:41d5630fd3633e2a
  qyl.mcp:
    npm: {qyl-mcp-server: 8.1.3}
    latest: 8.1.3
    deploys: https://mcp.qyl.at (qyl-mcp, Railway) on push to main; healthz 200
  Qyl.Telemetry.AutoInstrumentation:   # renamed from Qyl.OpenTelemetry.AutoInstrumentation on 2026-10-11; the old URL redirects
    nuget: {Qyl.Telemetry.AutoInstrumentation: 25.0.0, Qyl.Telemetry.AutoInstrumentation.Hosting: 25.0.0, Qyl.Telemetry.AutoInstrumentation.SqlClient: 25.0.0, Qyl.Telemetry.AutoInstrumentation.DiagnosticListeners: 25.0.0, Qyl.Telemetry.AutoInstrumentation.EntityFrameworkCore: 25.0.0, Qyl.Telemetry.Hosting: 25.0.0}
    latest: 25.0.0
  Qyl.Telemetry.SemanticConventions:   # renamed from Qyl.OpenTelemetry.SemanticConventions on 2026-10-11; the old URL redirects
    nuget: {Qyl.Telemetry.SemanticConventions: 10.0.0, Qyl.Telemetry.SemanticConventions.Incubating: 10.0.0, Qyl.Telemetry.SemanticConventions.Analyzers: 10.0.0}
    npm: {"@ancplua/qyl-semantic-conventions": 10.0.0}
    latest: 10.0.0
    schema_served: https://qyl.at/schemas/10.0.0 (200)
  qyl.at:
    publishes: nothing; ./release.sh deploys https://qyl.at from main (nothing deploys on push); https://qyl.at/ 200
