# Published and indexed versions of the qyl-dev repos, read from the registries.
# The registries are the truth; each producer's release.sh runs
# qyl.at/scripts/refresh-published-versions.sh once its release is indexed and verified,
# which rewrites, commits and pushes this file; git log dates each refresh.
repos:
  qyl:
    nuget: {qyl: 15.0.2, qyl.osx-arm64: 15.0.2, qyl.osx-x64: 15.0.2, qyl.linux-arm64: 15.0.2, qyl.linux-x64: 15.0.2, qyl.win-x64: 15.0.2, qyl.win-arm64: 15.0.2, Qyl.Api.Sdk: 15.0.2, Qyl.Orchestration: 15.0.2}
    latest: 15.0.2
    deploys: https://api.qyl.at (qyl-collector, Railway) on push to main; serving contract revision sha256:f2930dd99ff08bb5
  qyl-api-schema:
    nuget: {Qyl.Api.Contracts: 14.0.1}
    npm: {"@ancplua/qyl-api-schema": 14.0.1}
    latest: 14.0.1
    contract_revision_served: sha256:f2930dd99ff08bb5
  qyl.mcp:
    npm: {qyl-mcp-server: 10.1.0}
    latest: 10.1.0
    deploys: https://mcp.qyl.at (qyl-mcp, Railway) on push to main; healthz 200
  Qyl.Telemetry.AutoInstrumentation:   # renamed from Qyl.OpenTelemetry.AutoInstrumentation on 2026-10-11; the old URL redirects
    nuget: {Qyl.Telemetry.AutoInstrumentation: 27.0.0, Qyl.Telemetry.AutoInstrumentation.Hosting: 27.0.0, Qyl.Telemetry.AutoInstrumentation.SqlClient: 27.0.0, Qyl.Telemetry.AutoInstrumentation.DiagnosticListeners: 27.0.0, Qyl.Telemetry.AutoInstrumentation.EntityFrameworkCore: 27.0.0, Qyl.Telemetry.Hosting: 27.0.0}
    latest: 27.0.0
  Qyl.Telemetry.SemanticConventions:   # renamed from Qyl.OpenTelemetry.SemanticConventions on 2026-10-11; the old URL redirects
    nuget: {Qyl.Telemetry.SemanticConventions: 13.1.1, Qyl.Telemetry.SemanticConventions.Incubating: 13.1.1, Qyl.Telemetry.SemanticConventions.Analyzers: 13.1.1}
    npm: {"@ancplua/qyl-semantic-conventions": 13.1.1}
    latest: 13.1.1
    schema_served: https://qyl.at/schemas/13.1.1 (200)
  qyl.at:
    publishes: nothing; ./release.sh deploys https://qyl.at from main (nothing deploys on push); https://qyl.at/ 200
