# Published and indexed versions of the qyl-dev repos, read from the registries.
# The registries are the truth; each producer's release.sh runs
# qyl.at/scripts/refresh-published-versions.sh once its release is indexed and verified,
# which rewrites, commits and pushes this file; git log dates each refresh.
repos:
  qyl:
    nuget: {qyl: 13.2.1, qyl.osx-arm64: 13.2.1, qyl.osx-x64: 13.2.1, qyl.linux-arm64: 13.2.1, qyl.linux-x64: 13.2.1, qyl.win-x64: 13.2.1, qyl.win-arm64: 13.2.1, Qyl.Api.Sdk: 13.2.1, Qyl.Orchestration: 13.2.1}
    latest: 13.2.1
    deploys: https://api.qyl.at (qyl-collector, Railway) on push to main; serving contract revision sha256:f2930dd99ff08bb5
  qyl-api-schema:
    nuget: {Qyl.Api.Contracts: 14.0.0}
    npm: {"@ancplua/qyl-api-schema": 14.0.0}
    latest: 14.0.0
    contract_revision_served: sha256:f2930dd99ff08bb5
  qyl.mcp:
    npm: {qyl-mcp-server: 9.0.0}
    latest: 9.0.0
    deploys: https://mcp.qyl.at (qyl-mcp, Railway) on push to main; healthz 200
  Qyl.Telemetry.AutoInstrumentation:   # renamed from Qyl.OpenTelemetry.AutoInstrumentation on 2026-10-11; the old URL redirects
    nuget: {Qyl.Telemetry.AutoInstrumentation: 26.0.0, Qyl.Telemetry.AutoInstrumentation.Hosting: 26.0.0, Qyl.Telemetry.AutoInstrumentation.SqlClient: 26.0.0, Qyl.Telemetry.AutoInstrumentation.DiagnosticListeners: 26.0.0, Qyl.Telemetry.AutoInstrumentation.EntityFrameworkCore: 26.0.0, Qyl.Telemetry.Hosting: 26.0.0}
    latest: 26.0.0
  Qyl.Telemetry.SemanticConventions:   # renamed from Qyl.OpenTelemetry.SemanticConventions on 2026-10-11; the old URL redirects
    nuget: {Qyl.Telemetry.SemanticConventions: 12.0.0, Qyl.Telemetry.SemanticConventions.Incubating: 12.0.0, Qyl.Telemetry.SemanticConventions.Analyzers: 12.0.0}
    npm: {"@ancplua/qyl-semantic-conventions": 12.0.0}
    latest: 12.0.0
    schema_served: https://qyl.at/schemas/12.0.0 (200)
  qyl.at:
    publishes: nothing; ./release.sh deploys https://qyl.at from main (nothing deploys on push); https://qyl.at/ 200
